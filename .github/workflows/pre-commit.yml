name: Pre-commit

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.x'

      - name: Install pre-commit
        run: pip install pre-commit

      # helm-docs needs a binary on the runner; docs.yml regenerates READMEs after merge.
      - name: Run pre-commit
        env:
          SKIP: helm-docs
        run: pre-commit run --all-files --show-diff-on-failure
