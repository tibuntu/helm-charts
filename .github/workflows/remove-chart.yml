name: Remove Chart

on:
  workflow_dispatch:
    inputs:
      chart_name:
        description: "Chart name(s) to remove from the index (comma-separated for multiple: jelu,unpoller)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - name: Validate chart_name
        env:
          CHART_NAMES: ${{ inputs.chart_name }}
        run: |
          re='^[a-z0-9-]+(,[a-z0-9-]+)*$'
          if [[ ! "$CHART_NAMES" =~ $re ]]; then
            echo "::error::chart_name must be comma-separated lowercase chart names (a-z, 0-9, -), got: $CHART_NAMES"
            exit 1
          fi

      - name: Checkout gh-pages
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: gh-pages

      - name: Remove chart(s) from index.yaml
        env:
          CHART_NAMES: ${{ inputs.chart_name }}
        run: |
          python3 << 'EOF'
          import os, yaml

          charts = [c.strip() for c in os.environ["CHART_NAMES"].split(",")]

          with open("index.yaml") as f:
              index = yaml.safe_load(f)

          for chart in charts:
              if chart in index.get("entries", {}):
                  del index["entries"][chart]
                  print(f"Removed '{chart}' from index.yaml")
              else:
                  print(f"WARNING: '{chart}' not found in index.yaml")

          with open("index.yaml", "w") as f:
              yaml.dump(index, f, default_flow_style=False, sort_keys=False, allow_unicode=True)
          EOF

      - name: Commit and push
        env:
          CHART_NAMES: ${{ inputs.chart_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.yaml
          git diff --staged --quiet || git commit -m "chore: remove $CHART_NAMES from Helm index"
          git push

      - name: Delete GitHub Releases and tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHART_NAMES: ${{ inputs.chart_name }}
        run: |
          for chart in $(echo "$CHART_NAMES" | tr ',' ' '); do
            echo "Looking for releases matching '${chart}-<version>'..."
            gh release list --limit 1000 --json tagName --jq '.[].tagName' \
              | grep -E "^${chart}-[0-9]+\.[0-9]+\.[0-9]+" \
              | while read -r tag; do
                  echo "Deleting release and tag: $tag"
                  gh release delete "$tag" --yes --cleanup-tag
                done
          done
