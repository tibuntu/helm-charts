name: Release Chart

on:
  push:
    branches:
      - main
    paths:
      - "charts/**/Chart.yaml"

jobs:
  test:
    permissions:
      contents: read
    uses: ./.github/workflows/ct.yml

  release:
    needs: test
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
      - name: Install Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      # cr uses RELEASE-NOTES.md from the chart package as the GitHub Release body
      # (cr.yaml); without it the body is just the chart description.
      - name: Write release notes from artifacthub.io/changes
        run: |
          for chart in charts/*/; do
            yq '.annotations["artifacthub.io/changes"] // "[]" | from_yaml | .[] | "- **" + .kind + "**: " + .description' \
              "${chart}Chart.yaml" > "${chart}RELEASE-NOTES.md"
          done

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@92c6b97fa9f664492a2592e0d1d80bc6bf378957 # v1.9.0
        with:
          charts_dir: charts/
          config: cr.yaml
          skip_existing: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
