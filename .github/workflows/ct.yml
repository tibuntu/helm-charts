name: Chart Testing

on:
  pull_request:
    paths:
      - 'charts/**'
      - '.github/workflows/ct.yml'
      - 'ct.yaml'
  push:
    branches:
      - main
    paths:
      - 'charts/**'
      - '.github/workflows/ct.yml'
      - 'ct.yaml'
  workflow_dispatch:
  # Called by helm.yml before a release. github.event_name is the caller's
  # event (push), so the "Select charts" step takes the all-charts path.
  workflow_call:

permissions:
  contents: read

jobs:
  chart-testing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.x'
          check-latest: true

      - name: Set up chart-testing
        uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0

      # Pull requests test the charts changed against target-branch (ct.yaml).
      # push and workflow_dispatch have no target branch to diff against,
      # so they test every chart and skip the version-increment check
      # (it always fails on the default branch itself).
      - name: Select charts to test
        id: select
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [[ "$EVENT" == "pull_request" ]]; then
            changed=$(ct list-changed)
            if [[ -n "$changed" ]]; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
            fi
          else
            {
              echo "changed=true"
              echo "lint_args=--all --check-version-increment=false"
              echo "install_args=--all"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Run chart-testing (lint)
        if: steps.select.outputs.changed == 'true'
        run: ct lint ${{ steps.select.outputs.lint_args }}

      - name: Create kind cluster
        if: steps.select.outputs.changed == 'true'
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2

      - name: Run chart-testing (install)
        if: steps.select.outputs.changed == 'true'
        run: ct install ${{ steps.select.outputs.install_args }}
