apiVersion: v1
kind: Pod
metadata:
  name: {{ include "generic.fullname" . }}-test-connection
  labels:
    {{- include "generic.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  {{- with .Values.podSecurityContext }}
  securityContext:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  containers:
    - name: nc
      image: busybox:1.38.0
      # TCP connect to the Service; retry for up to ~60s while the app starts
      command:
        - sh
        - -c
        - >-
          for i in $(seq 1 30); do
          nc -z -w 2 {{ include "generic.fullname" . }} {{ .Values.service.port }} && exit 0;
          sleep 2; done; exit 1
      {{- with .Values.securityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
