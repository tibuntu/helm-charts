---
apiVersion: v2
name: generic
description: A Helm chart for generic applications
type: application
kubeVersion: ">=1.22.0-0"
version: 0.10.0
appVersion: ""
keywords:
  - generic
home: https://github.com/tibuntu/helm-charts/tree/main/charts/generic
sources:
  - https://github.com/tibuntu/helm-charts
maintainers:
  - name: tibuntu
    url: https://github.com/tibuntu
dependencies: []
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/changes: |
    - kind: added
      description: add persistence.annotations (e.g. helm.sh/resource-policy keep), persistence.existingClaim and per-entry annotations on additionalPersistentVolumeClaims
    - kind: changed
      description: probes default to the container port (named port http); any probe field (periodSeconds, timeoutSeconds, failureThreshold, ...) can now be set and a startupProbe is available
    - kind: changed
      description: default securityContext adds allowPrivilegeEscalation false and seccompProfile RuntimeDefault to meet the restricted Pod Security Standard; values files that override part of securityContext also receive both keys (set them explicitly to opt out); new serviceAccount.automount (default true) sets automountServiceAccountToken on the pod
    - kind: changed
      description: environment now defaults to [] and must be a list of Kubernetes env entries; a non-empty map is rejected by the schema (it never rendered valid YAML), so convert maps like FOO=bar to name/value list entries; an empty map is still accepted
    - kind: added
      description: add envFrom (configMapRef / secretRef sources), rendered on the container when set
    - kind: added
      description: add containerPort (default empty, same as service.port) so the container port can differ from the Service port; probes on the named port http follow it
    - kind: added
      description: add service.annotations, rendered on the Service (e.g. Tailscale, MetalLB, external-dns)
    - kind: removed
      description: remove ExternalName from the service.type enum; the template never rendered externalName, so the API server rejected such a Service
    - kind: changed
      description: unknown values keys now fail schema validation (a typo such as persistance is no longer silently ignored) and image.registry and image.repository are required (helm template and install fail without them); remove stray keys from your values files and set both image fields
    - kind: added
      description: add a helm test (TCP connect to the Service), NOTES.txt install hints and a .helmignore that keeps ci/ out of the package
    - kind: added
      description: document every value and add an install example to the README
    - kind: added
      description: add chart metadata (maintainers, sources, license)
